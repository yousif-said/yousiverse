name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://yousiverse:yousiverse@localhost:5432/yousiverse
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  # Optional Turborepo remote cache. Turbo runs uncached when these are unset.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yousiverse
          POSTGRES_PASSWORD: yousiverse
          POSTGRES_DB: yousiverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yousiverse -d yousiverse"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Migrate and seed database
        run: bun run db:migrate && bun run db:seed
      - name: Unit and integration tests
        run: bun run test
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end tests
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

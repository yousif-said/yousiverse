services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yousiverse
      POSTGRES_PASSWORD: yousiverse
      POSTGRES_DB: yousiverse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yousiverse -d yousiverse"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
